version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    # Conventional-commit prefix so release-please / commitlint stay happy.
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      # Batch low-risk updates into a single PR to cut review noise.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        versions: [">=6.1"]

  - package-ecosystem: cargo
    directory: "/helper"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: rust-toolchain
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
