name: macOS helper compatibility

on:
  push:
    branches: [main]
    paths:
      - "helper/**"
      - "rust-toolchain.toml"
      - ".github/workflows/helper-macos.yml"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [main]
    paths:
      - "helper/**"
      - "rust-toolchain.toml"
      - ".github/workflows/helper-macos.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helper-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on macOS 15
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # v1; toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: helper -> target
      # The same universal build as release.yml, so a pull request catches
      # what would otherwise only fail at release time.
      - name: Build universal binary
        working-directory: helper
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          lipo -create -output eule-helper-universal \
            target/aarch64-apple-darwin/release/eule-helper \
            target/x86_64-apple-darwin/release/eule-helper
          lipo -info eule-helper-universal
