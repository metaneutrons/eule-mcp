name: Release helper binaries

# Builds eule-helper for every platform × arch and attaches the binaries (plus
# .sha256 sidecars) to the GitHub release for the pushed tag. The Node package
# downloads the matching asset on first use (see src/helper/download.ts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach binaries to"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: one universal2 binary (arm64 + x86_64 fused with lipo).
          - os: macos-14
            kind: mac
            asset: eule-helper-darwin-universal
          - os: ubuntu-24.04
            kind: linux
            target: x86_64-unknown-linux-gnu
            asset: eule-helper-linux-x64
          - os: ubuntu-24.04-arm
            kind: linux
            target: aarch64-unknown-linux-gnu
            asset: eule-helper-linux-arm64
          - os: windows-latest
            kind: win
            target: x86_64-pc-windows-msvc
            asset: eule-helper-win32-x64.exe
          # If the windows-11-arm runner is unavailable, switch this to
          # cross-compile aarch64-pc-windows-msvc from windows-latest.
          - os: windows-11-arm
            kind: win
            target: aarch64-pc-windows-msvc
            asset: eule-helper-win32-arm64.exe
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.kind == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper -> target

      - name: Linux GUI deps (WebKitGTK)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build (macOS universal)
        if: matrix.kind == 'mac'
        working-directory: helper
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output "${{ matrix.asset }}" \
            target/aarch64-apple-darwin/release/eule-helper \
            target/x86_64-apple-darwin/release/eule-helper

      - name: Build (Linux / Windows)
        if: matrix.kind != 'mac'
        working-directory: helper
        shell: bash
        run: |
          cargo build --release --target "${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/eule-helper"
          [ "${{ matrix.kind }}" = win ] && bin="${bin}.exe"
          cp "$bin" "${{ matrix.asset }}"

      - name: Checksum
        working-directory: helper
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            helper/${{ matrix.asset }}
            helper/${{ matrix.asset }}.sha256
