name: Release helper binaries

# Builds eule-helper for every platform × arch and attaches the binaries (plus
# .sha256 sidecars) to the GitHub release for the pushed tag. The Node package
# downloads the matching asset on first use (see src/helper/download.ts).
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach binaries to"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: one universal2 binary (arm64 + x86_64 fused with lipo).
          - os: macos-14
            kind: mac
            asset: eule-helper-darwin-universal
          - os: ubuntu-24.04
            kind: linux
            target: x86_64-unknown-linux-gnu
            asset: eule-helper-linux-x64
          - os: ubuntu-24.04-arm
            kind: linux
            target: aarch64-unknown-linux-gnu
            asset: eule-helper-linux-arm64
          - os: windows-latest
            kind: win
            target: x86_64-pc-windows-msvc
            asset: eule-helper-win32-x64.exe
          # If the windows-11-arm runner is unavailable, switch this to
          # cross-compile aarch64-pc-windows-msvc from windows-latest.
          - os: windows-11-arm
            kind: win
            target: aarch64-pc-windows-msvc
            asset: eule-helper-win32-arm64.exe
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.kind == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper -> target

      - name: Linux GUI deps (WebKitGTK)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Build (macOS universal)
        if: matrix.kind == 'mac'
        working-directory: helper
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output "${{ matrix.asset }}" \
            target/aarch64-apple-darwin/release/eule-helper \
            target/x86_64-apple-darwin/release/eule-helper
          # lipo invalidates the per-arch ad-hoc signatures cargo applies, and
          # Apple Silicon refuses to run an unsigned Mach-O — re-sign ad-hoc as a
          # runnable baseline (replaced by Developer ID in the next step when
          # signing secrets are configured).
          codesign --force --sign - "${{ matrix.asset }}"

      - name: Sign & notarize (macOS)
        if: matrix.kind == 'mac'
        working-directory: helper
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "No signing secrets configured — shipping the ad-hoc-signed binary."
            exit 0
          fi
          # Developer ID cert → a temporary, self-contained keychain.
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -hex 20)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk '/Developer ID Application/{print $2; exit}')"
          if [ -z "$IDENTITY" ]; then echo "No Developer ID Application identity in the cert"; exit 1; fi
          # Hardened runtime + secure timestamp (both required for notarization).
          codesign --force --options runtime --timestamp --sign "$IDENTITY" --keychain "$KC" "${{ matrix.asset }}"
          codesign --verify --strict --verbose=2 "${{ matrix.asset }}"
          # Notarize with the App Store Connect API key. A bare Mach-O cannot be
          # stapled, so the ticket is served online (Gatekeeper checks on first
          # launch of a quarantined copy; our lazy download writes no quarantine).
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "${{ matrix.asset }}" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/notarize.zip"

      - name: Build (Linux / Windows)
        if: matrix.kind != 'mac'
        working-directory: helper
        shell: bash
        run: |
          cargo build --release --target "${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/eule-helper"
          [ "${{ matrix.kind }}" = win ] && bin="${bin}.exe"
          cp "$bin" "${{ matrix.asset }}"

      - name: Checksum
        working-directory: helper
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
          files: |
            helper/${{ matrix.asset }}
            helper/${{ matrix.asset }}.sha256
