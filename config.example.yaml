# Eule MCP configuration
language: de # de | en

# OAuth settings — defaults to Thunderbird's app registration.
# Override with your own Azure AD app if available.
#
# apiVersion: "v2" (default) uses the modern /oauth2/v2.0 endpoint with scope=.
# Set "v1" for locked-down tenants where only a legacy public client is
# consentable (Thunderbird, or "Apple Internet Accounts"
# f8d98a96-0999-43f5-8af3-69971c7bb423 for EWS): v1 uses /oauth2 with resource=.
# The v1-vs-v2 choice + client id are stored per token, so refresh reuses them.
# oauth:
#   clientId: "9e5f94bc-e8a4-4e73-b8be-63364c29d753"
#   tenant: "common"
#   apiVersion: "v2" # or "v1"

# Optional: TOTP autofill for `login --capture` (the native webview helper).
# The password is always typed by you in the webview; only the MFA code is
# auto-entered from this secret. Set it via the credential window, not by hand:
#   node dist/cli/index.js secret totp --account user@example.com
# autoAuth:
#   - account: "user@example.com"
#     totpSecret: "YOUR_BASE32_TOTP_SECRET"

roles:
  - id: VPDIT
    name: "VP Hochschule Hannover"
    weeklyHours: 20
    contexts: ["@office", "@remote"]
    connectors:
      mail:
        - id: vpdit-personal
          type: m365
          account: fabian@hs-hannover.de
        # Shared/delegate mailbox: authenticate as your own account, read the
        # shared one via `mailbox:` (NOT a `shared:` flag — that does nothing).
        - id: vpdit-shared
          type: m365
          account: fabian@hs-hannover.de
          mailbox: vp-dit@hs-hannover.de
      calendar:
        - id: vpdit-cal
          type: m365
          account: fabian@hs-hannover.de
  - id: lexICT
    name: "lexICT GmbH"
    weeklyHours: 8
    connectors:
      mail:
        - id: lexict-mail
          type: m365
          account: fabian@lexict.de
      calendar:
        - id: lexict-cal
          type: m365
          account: fabian@lexict.de
  - id: CDU
    name: "CDU Gehrden"
    weeklyHours: 4
    connectors: {}
  - id: private
    name: "Private"
    weeklyHours: 0
    connectors: {}
