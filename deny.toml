# cargo-deny policy for the Rust helper.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "Transitive GTK/WebKit dependency; upstream offers no safe upgrade yet. Revisit when gtk-rs removes proc-macro-error." },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "GPL-3.0-or-later",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
